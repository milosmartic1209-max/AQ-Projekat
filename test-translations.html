<!DOCTYPE html>
<html>
<head>
    <title>Language Test</title>
</head>
<body>
    <h1>Testing JSON Loading</h1>
    <button onclick="testLoad()">Test Load Translations</button>
    <div id="output"></div>
    
    <script>
        async function testLoad() {
            try {
                const response = await fetch('./locales/me.json');
                const data = await response.json();
                document.getElementById('output').innerHTML = 
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('output').innerHTML = 
                    'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
